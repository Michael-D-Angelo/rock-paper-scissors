<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div id="content">
        <p>These buttons are same just using 3 different DOM selectors</p>
        <div class="buttons">
          <button id="btn1">Play</button>
          <button class="btn2">Play</button>
          <button>Play</button>
        </div>
        <div class="winAnnounce"></div>
        <div class="humanScore">
          Human: <span class="scoreNumHuman">0</span>
        </div>
        <div class="comScore">Computer: <span class="scoreNumCom">0</span></div>
      </div>
    </main>
  </body>
  <script src="/scripts/scripts.js"></script>
</html>
